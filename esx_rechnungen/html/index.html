<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechnungssystem</title>
    <link rel="stylesheet" href="css/menu.css">
</head>
<body>
    <div id="menu-root" class="hidden">
        <div class="menu-panel" id="menu-panel">
            <header class="menu-header">
                <button class="menu-back hidden" id="btn-back" type="button"></button>
                <div class="menu-header-text">
                    <h1 id="menu-title">Rechnungen</h1>
                    <p id="menu-subtitle"></p>
                </div>
                <button class="menu-close" id="btn-close" type="button"></button>
            </header>

            <nav class="menu-tabs hidden" id="admin-tabs">
                <button class="tab active" data-tab="invoices">Rechnungen</button>
                <button class="tab" data-tab="jobs">Jobs</button>
                <button class="tab" data-tab="societies">Firmen</button>
                <button class="tab" data-tab="settings">System</button>
            </nav>

            <div class="menu-body" id="menu-body"></div>
        </div>
    </div>

    <div id="dialog-overlay" class="dialog-overlay hidden">
        <div class="dialog-box">
            <div class="dialog-icon-wrap" id="dialog-icon"></div>
            <h3 id="dialog-title" class="dialog-title">Hinweis</h3>
            <p id="dialog-message" class="dialog-message"></p>
            <input type="text" id="dialog-input" class="dialog-input hidden" autocomplete="off">
            <div class="dialog-actions" id="dialog-actions"></div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        (function loadScripts(i) {
            var res = (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'esx_rechnungen';
            var files = ['js/icons.js', 'js/dialogs.js', 'js/menu.js'];
            if (i >= files.length) return;
            var s = document.createElement('script');
            s.src = 'nui://' + res + '/html/' + files[i];
            s.onload = function() { loadScripts(i + 1); };
            document.body.appendChild(s);
        })(0);
    </script>
</body>
</html>
