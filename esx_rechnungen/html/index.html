<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechnungssystem</title>
    <link rel="stylesheet" href="css/billing.css">
</head>
<body>
    <div id="billing-root" class="hidden">
        <div class="billing-panel" id="billing-panel">
            <header class="billing-header">
                <div class="billing-brand">
                    <div class="billing-logo">R</div>
                    <div class="billing-brand-text">
                        <h1>RECHNUNGEN</h1>
                        <div class="billing-player">
                            <span id="billing-player-name">Spieler</span>
                        </div>
                    </div>
                </div>
                <button class="billing-esc" id="btn-close" type="button">
                    <span class="esc-key">ESC</span>
                </button>
            </header>

            <nav class="billing-tabs" id="billing-tabs">
                <button class="billing-tab active" data-tab="overview" type="button">ÜBERSICHT</button>
                <button class="billing-tab" data-tab="statistics" type="button">STATISTIK</button>
                <button class="billing-tab" data-tab="create" type="button">RECHNUNG ERSTELLEN</button>
                <button class="billing-tab hidden" data-tab="admin" type="button" id="tab-admin">ADMIN</button>
            </nav>

            <div class="billing-body" id="billing-body"></div>
        </div>
    </div>

    <div id="detail-modal" class="detail-modal hidden">
        <div class="detail-modal-box">
            <header class="detail-modal-header">
                <div>
                    <h2 id="detail-title">Rechnung</h2>
                    <span id="detail-badge" class="status-badge"></span>
                </div>
                <button class="detail-close" id="detail-close" type="button"></button>
            </header>
            <div class="detail-modal-body" id="detail-body"></div>
            <footer class="detail-modal-footer" id="detail-footer"></footer>
        </div>
    </div>

    <div id="dialog-overlay" class="dialog-overlay hidden">
        <div class="dialog-box">
            <div class="dialog-icon-wrap" id="dialog-icon"></div>
            <h3 id="dialog-title" class="dialog-title">Hinweis</h3>
            <p id="dialog-message" class="dialog-message"></p>
            <input type="text" id="dialog-input" class="dialog-input hidden" autocomplete="off">
            <div class="dialog-actions" id="dialog-actions"></div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script>
        (function loadScripts(i) {
            var res = (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'esx_rechnungen';
            var files = ['js/icons.js', 'js/dialogs.js', 'js/billing.js'];
            if (i >= files.length) return;
            var s = document.createElement('script');
            s.src = 'nui://' + res + '/html/' + files[i];
            s.onload = function() { loadScripts(i + 1); };
            document.body.appendChild(s);
        })(0);
    </script>
</body>
</html>
